# The tools the gate uses on the host. PostgreSQL itself (the server,
# psql, pg_config, PGXS and pg_regress) comes from the gate's Docker image,
# docker/Dockerfile, never from the host.
[tools]
# sqlfluff is installed through uv into a virtualenv on this pinned Python.
python = "3.14.8"
"aqua:astral-sh/uv" = "0.13.4"
"pipx:sqlfluff" = "4.4.0"

[settings]
pipx.uvx = true

[tasks."gate:loop"]
description = "Inner loop: build the image, start the server and run make installcheck (never the advancement gate)"
run = "bash docker/installcheck.sh"

[tasks.gate]
description = "The full gate"
run = """
#!/usr/bin/env bash
set -euo pipefail
step() { printf '\\n==> %s\\n' "$1"; }

step "docker"
docker --version

# Builds the image, starts the server and prints its version, runs
# make install and make installcheck, prints regression.diffs on a
# failure, and removes the container on every exit.
bash docker/installcheck.sh

step "sqlfluff lint (postgres dialect, .sqlfluff)"
sqlfluff --version
sqlfluff lint uxid--*.sql test/sql

step "conformance corpus check"
# The corpus is vendored by a later change, with scripts/corpus-check.sh
# beside it. Once either exists the check runs, and a missing script is
# then a failure, not a skip.
if [ -d conformance ] || [ -e scripts/corpus-check.sh ]; then
  bash scripts/corpus-check.sh
else
  echo "no conformance/ in this tree: the corpus is not vendored yet"
fi

printf '\\ngate: green\\n'
"""
